services:
  cache_context.day:
    class: Drupal\eonext_opening_hours\Cache\Context\DayCacheContext
    arguments: ["@datetime.time"]
    tags:
      - { name: cache.context, id: "day" }

  eonext_opening_hours.response_subscriber:
    class: Drupal\eonext_opening_hours\EventSubscriber\OpeningHoursResponseSubscriber
    arguments: ['@language_manager', '@entity_type.manager']
    tags:
      - { name: event_subscriber }

  eonext_opening_hours.request_subscriber:
    class: Drupal\eonext_opening_hours\EventSubscriber\OpeningHoursRequestSubscriber
    arguments: ['@entity_type.manager']
    tags:
      - { name: event_subscriber }
