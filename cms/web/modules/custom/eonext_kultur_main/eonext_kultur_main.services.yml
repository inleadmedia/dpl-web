services:
  eonext_kultur_main.footer_social_loader:
    class: Drupal\eonext_kultur_main\FooterSocialLoader
    arguments:
      - '@entity_type.manager'
      - '@config.factory'
      - '@path_alias.manager'
  eonext_kultur_main.hero_slide_builder:
    class: Drupal\eonext_kultur_main\HeroSlideBuilder
    arguments:
      - '@entity_type.manager'
      - '@string_translation'
      - '@dpl_event.reoccurring_date_formatter'
      - '@language_manager'
  eonext_kultur_main.nav_teaser_builder:
    class: Drupal\eonext_kultur_main\NavTeaserBuilder
  eonext_kultur_main.default_language_redirect:
    class: Drupal\eonext_kultur_main\EventSubscriber\DefaultLanguageRedirectSubscriber
    arguments:
      - '@config.factory'
    tags:
      - { name: event_subscriber }
  eonext_kultur_main.skip_go_revalidate:
    class: Drupal\eonext_kultur_main\EventSubscriber\SkipGoRevalidateSubscriber
    tags:
      - { name: event_subscriber }
