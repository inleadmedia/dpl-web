---
services:
  _defaults:
    autowire: true

  logger.channel.eonext_editorial_search:
    parent: logger.channel_base
    arguments: ['eonext_editorial_search']

  Drupal\eonext_editorial_search\Fbi\ComplexSearchClient:
    arguments:
      $logger: '@logger.channel.eonext_editorial_search'

  Drupal\eonext_editorial_search\ArticleMaterialSync:
    arguments:
      $logger: '@logger.channel.eonext_editorial_search'

  Drupal\eonext_editorial_search\EditorialContentExtractor: ~

  Drupal\eonext_editorial_search\EditorialEventSortDateResolver: ~

  eonext_editorial_search.taxonomy_facet_subscriber:
    class: Drupal\eonext_editorial_search\EventSubscriber\EditorialSearchTaxonomyFacetSubscriber
    tags:
      - { name: event_subscriber }

  # Keeps our configuration alive through DPL CMS configuration imports.
  eonext_editorial_search.overlay_config_subscriber:
    class: Drupal\eonext_editorial_search\EventSubscriber\OverlayConfigEventSubscriber
    arguments:
      - '@extension.path.resolver'
    tags:
      - { name: event_subscriber }

  eonext_editorial_search.route_subscriber:
    class: Drupal\eonext_editorial_search\Routing\RouteSubscriber
    tags:
      - { name: event_subscriber }
