services:
  eonext_kultur_events.event_detail_builder:
    class: Drupal\eonext_kultur_events\EventDetailBuilder
    arguments:
      - '@entity_type.manager'
      - '@dpl_event.reoccurring_date_formatter'
      - '@string_translation'
  eonext_kultur_events.listing_hero_builder:
    class: Drupal\eonext_kultur_events\EventsListingHeroBuilder
    arguments:
      - '@config.factory'
      - '@entity_type.manager'
  eonext_kultur_events.listing_redirect_subscriber:
    class: Drupal\eonext_kultur_events\EventSubscriber\EventsListingRedirectSubscriber
    tags:
      - { name: event_subscriber }
  eonext_kultur_events.listing_facet_url_subscriber:
    class: Drupal\eonext_kultur_events\EventSubscriber\EventsListingFacetUrlSubscriber
    arguments:
      - '@request_stack'
      - '@path.current'
    tags:
      - { name: event_subscriber }
