services:
  eonext_kultur_event_submissions.event_series_publisher:
    class: Drupal\eonext_kultur_event_submissions\Service\EventSeriesPublisher
    arguments:
      - '@entity_type.manager'
      - '@logger.channel.eonext_kultur_event_submissions'

  eonext_kultur_event_submissions.mail_notifier:
    class: Drupal\eonext_kultur_event_submissions\Service\SubmissionMailNotifier
    arguments:
      - '@plugin.manager.mail'
      - '@language_manager'
      - '@logger.channel.eonext_kultur_event_submissions'

  logger.channel.eonext_kultur_event_submissions:
    parent: logger.channel_base
    arguments: ['eonext_kultur_event_submissions']
